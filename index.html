<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Rewards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME PAGE -->
    <div id="homePage">

        <!-- HEADER -->
        <header>

            <button id="menuBtn">
                ☰
            </button>

            <h1 id="appName">
                A1 Rewards
            </h1>

        </header>

        <!-- MAIN -->
        <main>

            <!-- LOGO -->
            <section id="logoSection">

                <img id="logo" src="logo.png" alt="Logo">

            </section>

            <!-- WELCOME -->
            <section id="welcomeSection">

                <h2>Welcome</h2>

                <p>
                    Login to continue
                </p>

            </section>

            <!-- BUTTONS -->
            <section id="buttonSection">

                <button id="loginBtn">
                    Login
                </button>

                <button id="registerBtn">
                    Register
                </button>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
