<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <defs>
    <linearGradient id="badgeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ff"/>
      <stop offset="100%" stop-color="#0758d9"/>
    </linearGradient>

    <linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1267ee"/>
      <stop offset="100%" stop-color="#0647bd"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#0057e8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ribbon behind badge -->
  <path
    d="M30 62 L30 91 L42 83 L50 91 L50 62 Z"
    fill="url(#ribbonBlue)"/>

  <path
    d="M50 62 L50 91 L58 83 L70 91 L70 62 Z"
    fill="#0b55c9"/>

  <!-- Ribbon shine -->
  <path
    d="M34 67 L34 84 L42 79 L46 83 L46 67 Z"
    fill="#4d9aff"
    opacity="0.45"/>

  <!-- Main badge -->
  <circle
    cx="50"
    cy="45"
    r="31"
    fill="#eaf3ff"
    filter="url(#shadow)"/>

  <circle
    cx="50"
    cy="45"
    r="27"
    fill="url(#badgeBlue)"/>

  <!-- Inner circle -->
  <circle
    cx="50"
    cy="45"
    r="22"
    fill="none"
    stroke="#8fc1ff"
    stroke-width="1.5"
    opacity="0.6"/>

  <!-- User head -->
  <circle
    cx="50"
    cy="37"
    r="8"
    fill="#ffffff"/>

  <!-- User body -->
  <path
    d="M35 59
       C36.5 50.5 42 46 50 46
       C58 46 63.5 50.5 65 59
       Z"
    fill="#ffffff"/>

  <!-- Small blue highlight -->
  <circle
    cx="42"
    cy="29"
    r="2.5"
    fill="#ffffff"
    opacity="0.55"/>

</svg>
